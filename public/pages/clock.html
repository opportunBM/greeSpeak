<section id="clock" class="page active">
  <div class="section-heading">
    <div><p class="eyebrow">Tools</p><h1>Clock</h1></div>
    <a class="text-button" href="/home.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6m-6 6h12"/></svg>Back to home</a>
  </div>
  <div class="clock-card">
    <p class="eyebrow">Current time</p>
    <div id="digital-clock" class="digital-clock">--:--:--</div>
  </div>
  <div class="clock-tabs">
    <button class="clock-tab active" data-clock="stopwatch">Stopwatch</button>
    <button class="clock-tab" data-clock="timer">Timer</button>
  </div>
  <div id="stopwatch-panel" class="clock-panel">
    <div id="stopwatch-display" class="timer-display">00:00:00.00</div>
    <div class="button-row">
      <button id="stopwatch-start" class="send-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 12 7-12 7z"/></svg>Start</button>
      <button id="stopwatch-pause" class="secondary-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>Pause</button>
      <button id="stopwatch-lap" class="secondary-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2m5-3a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>Lap</button>
      <button id="stopwatch-reset" class="secondary-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>Reset</button>
    </div>
    <ol id="laps-list" class="laps-list"></ol>
  </div>
  <div id="timer-panel" class="clock-panel hidden">
    <div id="timer-display" class="timer-display">00:00</div>
    <div class="timer-inputs">
      <label>Minutes<input id="timer-minutes" type="number" min="0" max="999" value="5" /></label>
      <label>Seconds<input id="timer-seconds" type="number" min="0" max="59" value="0" /></label>
    </div>
    <div class="button-row">
      <button id="timer-start" class="send-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 12 7-12 7z"/></svg>Start</button>
      <button id="timer-pause" class="secondary-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zm5 0h3v14h-3z"/></svg>Pause</button>
      <button id="timer-reset" class="secondary-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8m0-5v5h5"/></svg>Reset</button>
    </div>
    <button id="alarm-stop" class="alarm-stop hidden"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>Stop alarm</button>
  </div>
</section>
