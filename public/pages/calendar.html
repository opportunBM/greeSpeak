<section id="calendar" class="page active">
  <div class="section-heading">
    <div><p class="eyebrow">Organization</p><h1>Calendar</h1></div>
    <a class="text-button" href="/home.html">Back to home</a>
  </div>
  <form id="task-form" class="simple-form task-form">
    <input id="task-title" type="text" placeholder="New task..." aria-label="Task title" />
    <label class="task-date-field">Date<input id="task-date" class="date-input" type="date" aria-label="Task date" /></label>
    <input id="task-time" type="time" value="09:00" aria-label="Task time" />
    <button class="send-button" type="submit">Add</button>
  </form>
  <div id="tasks-list" class="agenda-list"></div>
</section>
